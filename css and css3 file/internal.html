<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    text-align:center;
    margin:0;
}

.page1,.page2{
    width:300px;
    margin:100px auto;
    padding:20px;
    background:white;
    border:2px solid black;
    border-radius:10px;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
}

.button{
    display:inline-block;
    background:blue;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:5px;
}

.page2{
    display:none;
}

.page2:target{
    display:block;
}

.page2:target + .page1{
    display:none;
}
</style>

</head>

<body>

<!-- Success Page -->
<div id="success" class="page2">
    <h2 style="color:green;">Login Successfully! ✅</h2>
    <p>Welcome to the next page.</p>
</div>

<!-- Login Page -->
<div class="page1">
    <h2>LOGIN</h2>

    <input type="email" placeholder="Enter Email" required><br>

    <input type="password" placeholder="Enter Password"><br><br>

    <a href="#success" class="button">Submit</a>
</div>

</body>
</html>
